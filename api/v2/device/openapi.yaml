openapi: 3.0.0
info:
  title: Owner Devices API
  version: 2.0.0
  description: |
    API for listing devices known to the owner service.
    This API combines voucher metadata with onboarding (TO2) state to provide
    a comprehensive view of all devices, including their GUID changes after
    TO2 completion.
  contact:
    name: Go FDO Server API Support
    url: https://github.com/fido-device-onboard/go-fdo-server/issues
tags:
  - name: devices
    description: |
      Operations related to device listing and tracking.
      Devices are tracked through their vouchers and TO2 onboarding state.
      When a device completes TO2, its GUID may change, and both the old and
      new GUIDs are tracked.
paths:
  /devices:
    get:
      tags: [devices]
      summary: List all owner devices
      description: |
        Returns a paginated list of all devices known to the owner service,
        combining voucher metadata with onboarding (TO2) completion state.
        Each device includes:
        - Current GUID (from voucher)
        - Old GUID (if device completed TO2 and changed GUID)
        - Device info string
        - Creation and update timestamps
        - TO2 completion status and timestamp
        Results are ordered by updated_at timestamp in descending order.
      operationId: ListDevices
      parameters:
        - name: limit
          in: query
          description: The number of items to return per page.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set.
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: old_guid
          in: query
          description: Filter by old GUID (before TO2 completion, hex-encoded)
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{32}$
            example: 3f4e5d6c7b8a9f0e1d2c3b4a5f6e7d8c
      responses:
        '200':
          description: Successfully retrieved device list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesPaginated'
        '400':
          $ref: ../components/openapi.yaml#/components/responses/BadRequest
        '500':
          $ref: ../components/openapi.yaml#/components/responses/InternalServerError
components:
  schemas:
    DevicesPaginated:
      type: object
      required:
        - total
        - limit
        - offset
        - devices
      properties:
        total:
          type: integer
          description: Total number of devices available.
        limit:
          type: integer
          description: The number of items returned in this response.
        offset:
          type: integer
          description: The offset from the beginning of the collection.
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    Device:
      type: object
      description: |
        Device information combining voucher metadata and TO2 onboarding state.
        The `guid` field contains the current device GUID from the voucher.
        If the device completed TO2 and changed its GUID, the `old_guid` field
        contains the previous GUID. Otherwise, `old_guid` is empty.
      required:
        - guid
        - old_guid
        - device_info
        - created_at
        - updated_at
        - to2_completed
      properties:
        guid:
          type: string
          description: Current device GUID (hex-encoded)
          example: a1b2c3d4e5f6789012345678abcdef01
        old_guid:
          type: string
          description: Previous device GUID before TO2 (hex-encoded, empty if no TO2 completion)
          example: 3f4e5d6c7b8a9f0e1d2c3b4a5f6e7d8c
        device_info:
          type: string
          description: Device information string
          example: Intel NUC Model XYZ
        created_at:
          type: string
          format: date-time
          description: Timestamp when device was first registered
          example: '2024-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when device was last updated
          example: '2024-01-16T14:20:00Z'
        to2_completed:
          type: boolean
          description: Whether the device has completed TO2 onboarding
          example: true
        to2_completed_at:
          type: string
          format: date-time
          description: Timestamp when TO2 was completed (null if not completed)
          example: '2024-01-16T14:20:00Z'
          nullable: true
